<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>

<body
    class="bg-slate-950 text-slate-100 min-h-screen py-10 px-4 flex flex-col items-center justify-center relative overflow-x-hidden">

    <!-- Elementos decorativos de fundo (Glow) -->
    <div
        class="absolute top-10 left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-gradient-to-tr from-indigo-600/30 to-purple-600/30 blur-[120px] rounded-full pointer-events-none -z-10">
    </div>
    <div
        class="absolute bottom-10 right-10 w-[300px] h-[300px] bg-pink-600/20 blur-[100px] rounded-full pointer-events-none -z-10">
    </div>

    <!-- Container Principal -->
    <div class="max-w-4xl w-full space-y-8">

        <!-- Cabeçalho -->
        <div class="text-center space-y-2">
            <div
                class="inline-flex items-center justify-center p-3 bg-indigo-500/10 rounded-2xl border border-indigo-500/20 mb-2">
                <i class="fa-solid fa-user-plus text-indigo-400 text-2xl"></i>
            </div>
            <h1
                class="text-3xl md:text-4xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">
                Cadastro de Pessoas
            </h1>
            <p class="text-slate-400 text-sm md:text-base">Preencha os campos abaixo para salvar o registro no Firebase.
            </p>
        </div>

        <!-- Formulário Card -->
        <div class="glass rounded-3xl p-6 md:p-8 shadow-2xl relative">
            <form id="userForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- Nome Completo -->
                <div class="space-y-2 md:col-span-2">
                    <label
                        class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-user text-indigo-400"></i> Nome Completo
                    </label>
                    <input type="text" id="nome" required placeholder="Ex: Maria Silva"
                        class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition duration-200">
                </div>

                <!-- CPF -->
                <div class="space-y-2">
                    <label
                        class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-id-card text-indigo-400"></i> CPF
                    </label>
                    <input type="text" id="cpf" required maxlength="14" placeholder="000.000.000-00"
                        class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition duration-200">
                </div>

                <!-- Data de Nascimento -->
                <div class="space-y-2">
                    <label
                        class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-calendar text-indigo-400"></i> Data de Nascimento
                    </label>
                    <input type="date" id="dataNascimento" required
                        class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition duration-200 [color-scheme:dark]">
                </div>

                <!-- Salário -->
                <div class="space-y-2 md:col-span-2">
                    <label
                        class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-sack-dollar text-indigo-400"></i> Salário (R$)
                    </label>
                    <input type="text" id="salario" required placeholder="R$ 0,00"
                        class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition duration-200">
                </div>

                <!-- Botão Cadastrar -->
                <div class="md:col-span-2 pt-2">
                    <button type="submit" id="btnSubmit"
                        class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-indigo-500/25 transition duration-200 flex items-center justify-center gap-2 active:scale-[0.99]">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span id="btnText">Salvar Registro</span>
                    </button>
                </div>

            </form>
        </div>

        <!-- Alerta de Sucesso / ID Gerado -->
        <div id="successCard"
            class="hidden glass border-emerald-500/30 bg-emerald-950/20 rounded-2xl p-4 text-emerald-200 flex items-center justify-between animate-fade-in">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-circle-check text-emerald-400 text-xl"></i>
                <div>
                    <p class="font-semibold text-sm">Registro criado com sucesso!</p>
                    <p class="text-xs text-slate-400">ID Automático Firebase: <span id="generatedId"
                            class="font-mono bg-slate-800 text-indigo-300 px-2 py-0.5 rounded border border-slate-700"></span>
                    </p>
                </div>
            </div>
            <button onclick="document.getElementById('successCard').classList.add('hidden')"
                class="text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Tabela / Lista de Registros Cadastrados -->
        <div class="glass rounded-3xl p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                    <i class="fa-solid fa-database text-purple-400"></i> Registros Salvos
                </h2>
                <span id="totalCount"
                    class="text-xs font-mono bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700">0
                    cadastros</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="text-xs uppercase bg-slate-900/80 text-slate-400 border-b border-slate-800">
                        <tr>
                            <th class="py-3 px-4">ID Gerado</th>
                            <th class="py-3 px-4">Nome</th>
                            <th class="py-3 px-4">CPF</th>
                            <th class="py-3 px-4">Nascimento</th>
                            <th class="py-3 px-4">Salário</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="divide-y divide-slate-800/50">
                        <tr>
                            <td colspan="5" class="py-6 text-center text-slate-500">Nenhum registro encontrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- FIREBASE SCRIPT (ES Modules) -->
    <script type="module">
        // Importações do Firebase SDK v10
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            addDoc,
            onSnapshot,
            query,
            orderBy,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ SUBSTITUA COM AS SUAS CONFIGURAÇÕES DO FIREBASE ⚠️
        const firebaseConfig = {
            apiKey: "AIzaSyDwwvSAKfTUQOkvOs1Zz3o-DVJuDGzU0Kw",
            authDomain: "testefirebasecs.firebaseapp.com",
            projectId: "testefirebasecs",
            storageBucket: "testefirebasecs.firebasestorage.app",
            messagingSenderId: "8481422159",
            appId: "1:8481422159:web:e364c3fd7c493fcd96233a"
        };

        // Inicializa Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // MÁSCARAS DE INPUT (CPF e Salário)
        const cpfInput = document.getElementById('cpf');
        const salarioInput = document.getElementById('salario');

        cpfInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            e.target.value = value;
        });

        salarioInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (!value) {
                e.target.value = '';
                return;
            }
            const valorFormatado = (parseFloat(value) / 100).toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            });
            e.target.value = valorFormatado;
        });

        // SUBMIT DO FORMULÁRIO
        const form = document.getElementById('userForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const successCard = document.getElementById('successCard');
        const generatedIdSpan = document.getElementById('generatedId');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // UI Loading state
            btnSubmit.disabled = true;
            btnText.innerText = "Salvando...";

            const nome = document.getElementById('nome').value;
            const cpf = document.getElementById('cpf').value;
            const dataNascimento = document.getElementById('dataNascimento').value;
            const salario = document.getElementById('salario').value;

            try {
                // Envia para o Firestore (O Firebase gera o ID automaticamente via addDoc)
                const docRef = await addDoc(collection(db, "usuarios"), {
                    nome: nome,
                    cpf: cpf,
                    dataNascimento: dataNascimento,
                    salario: salario,
                    criadoEm: serverTimestamp()
                });

                // Mostra o card com o ID gerado
                generatedIdSpan.innerText = docRef.id;
                successCard.classList.remove('hidden');

                // Limpa o formulário
                form.reset();
            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert("Erro ao salvar dados no Firebase. Verifique se configurou suas credenciais corretamente no código.");
            } finally {
                btnSubmit.disabled = false;
                btnText.innerText = "Salvar Registro";
            }
        });

        // LISTAR EM TEMPO REAL (REALTIME LISTENER)
        const tableBody = document.getElementById('userTableBody');
        const totalCount = document.getElementById('totalCount');

        // Query para pegar os dados ordenados por data de criação
        const q = query(collection(db, "usuarios"), orderBy("criadoEm", "desc"));

        onSnapshot(q, (snapshot) => {
            tableBody.innerHTML = '';
            totalCount.innerText = `${snapshot.size} cadastros`;

            if (snapshot.empty) {
                tableBody.innerHTML = `
          <tr>
            <td colspan="5" class="py-6 text-center text-slate-500">Nenhum registro encontrado.</td>
          </tr>`;
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();

                // Formatar data de nascimento de AAAA-MM-DD para DD/MM/AAAA
                let dataFmt = data.dataNascimento;
                if (dataFmt && dataFmt.includes('-')) {
                    const [ano, mes, dia] = dataFmt.split('-');
                    dataFmt = `${dia}/${mes}/${ano}`;
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-900/50 transition duration-150";
                tr.innerHTML = `
          <td class="py-3 px-4 font-mono text-xs text-indigo-400 font-semibold">${doc.id}</td>
          <td class="py-3 px-4 font-medium text-white">${data.nome}</td>
          <td class="py-3 px-4">${data.cpf}</td>
          <td class="py-3 px-4">${dataFmt || '-'}</td>
          <td class="py-3 px-4 text-emerald-400 font-medium">${data.salario}</td>
        `;
                tableBody.appendChild(tr);
            });
        }, (error) => {
            console.error("Erro ao escutar banco:", error);
        });
    </script>
</body>

</html>
